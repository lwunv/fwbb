# Sao lưu database tự động, chạy trên máy của GitHub nên không cần máy ai bật.
#
# Vì sao tồn tại: ngày 24/10/2026 tài khoản Turso bị khoá do vượt hạn mức đọc,
# và lúc đó mới phát hiện KHÔNG LẤY ĐƯỢC DỮ LIỆU RA, vì export cũng bị tính là
# đọc. Không có bản sao lưu nào ở ngoài thì dữ liệu của cả nhóm bị nhốt trong
# một tài khoản bị khoá. Lịch này để chuyện đó không lặp lại.
#
# ━━━ CẦN BA BÍ MẬT TRONG REPO (Settings → Secrets and variables → Actions) ━━━
#   TURSO_DATABASE_URL   đường dẫn database
#   TURSO_AUTH_TOKEN     token đọc
#   BACKUP_PASSPHRASE    mật khẩu mã hoá bản dump (tự đặt, LƯU CHỖ KHÁC)
#
# Mất BACKUP_PASSPHRASE là mất luôn mọi bản sao lưu. Cất nó vào trình quản lý
# mật khẩu, đừng để duy nhất trong GitHub.
#
# ━━━ GIẢI MÃ MỘT BẢN SAO LƯU ━━━
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
#     -in fwbb-backup-<ngay>.json.enc -out dump.json -pass pass:'<mat khau>'
#
# ━━━ KHÔI PHỤC ━━━
#   node scripts/restore-db.mjs dump.json --target=file:./khoi-phuc.db
#   (bỏ --apply ra để chạy thử trước; xem thêm docs/backup-restore.md)

name: Sao lưu database

on:
  schedule:
    # MỖI GIỜ. Đây là cửa sổ mất mát: hỏng lúc nào thì mất nhiều nhất là số
    # phút kể từ lần chạy gần nhất.
    #
    # Vì sao không dày hơn: một bản dump đọc ~5.000 dòng, nên mỗi giờ chỉ tốn
    # 0,72% hạn mức đọc mỗi tháng (thoải mái). Nhưng mỗi lần chạy còn tốn phút
    # Actions, và repo riêng tư chỉ có 2.000 phút miễn phí mỗi tháng. Mỗi giờ
    # với job gọn là ~18% số phút đó; 15 phút/lần sẽ ngốn 72%, ăn gần hết chỗ
    # dự phòng cho mọi việc khác.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Chạy chồng lên nhau không có ích gì, chỉ tốn lượt đọc.
concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # Biên an toàn. Nhân bản giờ nạp theo lô nên job xong trong 1-2 phút, nhưng
    # 05/11/2026 bản nạp-từng-dòng từng mất ~8 phút và thỉnh thoảng vượt mốc 10
    # phút rồi bị huỷ, làm bản dự phòng "cũ" và cảnh báo sức khoẻ báo đỏ. 20 phút
    # không tốn thêm phút Actions khi chạy bình thường; nó chỉ là trần chống treo.
    timeout-minutes: 20
    permissions:
      contents: read

    # Khai ở cấp job vì `if:` của một bước KHÔNG đọc được `env:` của chính
    # bước đó. Chưa khai bí mật nào thì các bước nhân bản tự bỏ qua, và
    # workflow chạy đúng như trước khi có chúng.
    env:
      STANDBY_DATABASE_URL: ${{ secrets.STANDBY_DATABASE_URL }}
      STANDBY_AUTH_TOKEN: ${{ secrets.STANDBY_AUTH_TOKEN }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Kiểm ba bí mật trước khi làm gì
        # Thiếu secret thì GitHub thay bằng chuỗi RỖNG chứ không báo lỗi, và
        # script dump sẽ than "thiếu trong .env.local" - đúng với máy cá nhân
        # nhưng sai hoàn toàn khi chạy ở đây. Chặn sớm và nói thẳng thiếu cái gì.
        env:
          URL: ${{ secrets.TURSO_DATABASE_URL }}
          TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          test -n "$URL"   || missing="$missing TURSO_DATABASE_URL"
          test -n "$TOKEN" || missing="$missing TURSO_AUTH_TOKEN"
          test -n "$PASS"  || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Chua khai bi mat:$missing"
            echo ""
            echo "Them o: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  TURSO_DATABASE_URL  duong dan database"
            echo "  TURSO_AUTH_TOKEN    token doc"
            echo "  BACKUP_PASSPHRASE   mat khau ma hoa ban dump (tu dat, luu cho khac)"
            echo ""
            echo "Chi tiet: docs/backup-restore.md"
            exit 1
          fi
          echo "Du ca ba bi mat."

      - name: Cài phụ thuộc
        # Phải dùng pnpm, không phải npm. Dự án này quản lý phụ thuộc bằng
        # pnpm, và `npm install` trong đó chết với "Cannot read properties of
        # null (reading 'edgesOut')" vì npm không đọc được cây của pnpm.
        # Đã thử đổi sang npm cho nhanh hơn và hỏng đúng kiểu đó (run #16).
        # Có cache nên bước này chỉ mất vài giây.
        run: pnpm install --frozen-lockfile

      - name: Dump database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/backup-db.mjs ./backup.json

      - name: Kiểm bản dump có thật sự chứa dữ liệu
        # Một hệ thống sao lưu âm thầm lưu file rỗng còn tệ hơn là không có:
        # nó cho cảm giác an toàn giả. Thà đỏ còn hơn.
        run: |
          node -e "
            const d = require('./backup.json');
            const tables = Object.keys(d.tables ?? {});
            const rows = tables.reduce((n, t) => n + d.tables[t].length, 0);
            console.log('Bảng: ' + tables.length + ', dòng: ' + rows);
            if (tables.length < 10) { console.error('Quá ít bảng, nghi dump hỏng'); process.exit(1); }
            if (!d.tables.members || d.tables.members.length === 0) { console.error('Bảng members rỗng'); process.exit(1); }
            if (rows < 100) { console.error('Tổng số dòng quá ít, nghi dump hỏng'); process.exit(1); }
          "

      - name: Nhân bản sang database dự phòng (ghi được)
        id: replicate
        if: env.STANDBY_DATABASE_URL != ''
        # Dùng lại ĐÚNG bản chụp vừa tạo, không chụp lần nữa: chụp thêm một
        # lần là thêm một lượt đọc trên bản chính mà chẳng được gì.
        #
        # `continue-on-error`: nhân bản hỏng thì vẫn phải mã hoá và cất bản
        # sao lưu đã chụp được. Mất bản sao lưu vì một việc phụ hỏng là đánh
        # đổi sai. Bước cuối cùng của job sẽ làm đỏ nếu nó hỏng.
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/replicate-to-standby.mjs --apply --dump=./backup.json

      - name: Đẩy sang Cloudflare D1 (kho dự phòng, chỉ đọc)
        id: d1
        if: env.D1_DATABASE_NAME != ''
        continue-on-error: true
        # 6 TIẾNG MỘT LẦN, không phải mỗi giờ. D1 gói miễn phí cho 100.000
        # dòng GHI mỗi ngày, mà mỗi lần đẩy là ghi lại toàn bộ database. Chạy
        # hàng giờ là vượt hạn mức, rồi lớp dự phòng lại thành thứ gây sự cố.
        run: |
          hour=$(date -u +%H)
          if [ $((10#$hour % 6)) -ne 0 ]; then
            echo "Bỏ qua: chỉ đẩy vào các giờ 0, 6, 12, 18 UTC (giờ này là $hour)."
            exit 0
          fi
          node scripts/sync-to-d1.mjs --dump=./backup.json --apply

      - name: Mã hoá
        # Bản dump chứa họ tên, email, số điện thoại, SỐ TÀI KHOẢN NGÂN HÀNG và
        # mã băm mật khẩu. Không bao giờ để nó nằm dạng đọc được ngoài máy chủ.
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Thiếu BACKUP_PASSPHRASE"; exit 1; }
          # Chữ ký của bản đọc được, giữ lại để bước sau đối chiếu. Bản thân
          # chuỗi sha không tiết lộ nội dung gì.
          sha256sum ./backup.json | cut -d' ' -f1 > ./backup.sha256
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in ./backup.json \
            -out "./fwbb-backup-$(date -u +%Y-%m-%d_%H-%M).json.enc" \
            -pass env:BACKUP_PASSPHRASE
          shred -u ./backup.json 2>/dev/null || rm -f ./backup.json
          ls -la ./fwbb-backup-*.json.enc

      - name: Cất bản mã hoá
        uses: actions/upload-artifact@v4
        with:
          name: fwbb-backup-${{ github.run_id }}
          path: ./fwbb-backup-*.json.enc
          retention-days: 90
          if-no-files-found: error

      - name: Mở lại bản mã hoá để chắc nó dùng được
        # Đặt SAU bước cất, cố ý: dù bước này đỏ thì bản mã hoá vẫn nằm trong
        # kho để còn mổ xẻ.
        #
        # Không có bước này thì "sao lưu thành công" chỉ nghĩa là openssl
        # không báo lỗi lúc GHI. Thứ thật sự cần biết là file cất đi có mở lại
        # ra đúng nội dung cũ không. Mật khẩu lưu sai, tham số lệch, file hỏng
        # lúc ghi: cả ba chỉ lộ ra vào đúng ngày cần tới bản sao lưu, mà hôm
        # đó thì không còn đường lùi.
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Xoá bản đọc được dù bước này đi ra lối nào. Không có `trap` thì
          # khi openssl chết giữa chừng (mật khẩu sai), bash thoát ngay tại
          # dòng đó và bỏ lại một file PII dạng đọc được trong thư mục làm
          # việc, đúng vào lần chạy mà sau đó sẽ có người vào ngó nghiêng.
          trap 'shred -u ./verify.json 2>/dev/null || rm -f ./verify.json' EXIT
          enc=$(ls ./fwbb-backup-*.json.enc | head -1)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in "$enc" -out ./verify.json -pass env:BACKUP_PASSPHRASE
          after=$(sha256sum ./verify.json | cut -d' ' -f1)
          before=$(cat ./backup.sha256)
          if [ "$before" != "$after" ]; then
            echo "::error::Ban ma hoa KHONG mo lai ra dung noi dung ban dau."
            exit 1
          fi
          echo "Mo lai duoc, noi dung khop."

      - name: Báo đỏ nếu việc nhân bản hỏng
        # Đặt CUỐI cùng, sau khi bản sao lưu đã nằm an toàn trong kho lưu trữ.
        # Tới đây mới được phép làm đỏ.
        if: steps.replicate.outcome == 'failure' || steps.d1.outcome == 'failure'
        run: |
          echo "::error::Sao luu xong nhung NHAN BAN that bai."
          echo "  replicate: ${{ steps.replicate.outcome }}"
          echo "  d1:        ${{ steps.d1.outcome }}"
          echo "Ban sao luu ma hoa VAN duoc cat an toan. Xem log hai buoc tren."
          exit 1
